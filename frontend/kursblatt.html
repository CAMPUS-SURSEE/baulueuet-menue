<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Kursblatt Menüwahl BAULÜÜT</title>
<link rel="icon" type="image/webp" href="https://baulueuet.ch/wp-content/uploads/2019/06/cropped-bauluut_favicon_neg3-32x32.webp">
<style>
  :root {
    --orange: #E8722A;
    --schwarz: #111111;
    --grau: #767676;
    --linie: #ebebeb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: var(--schwarz);
    line-height: 1.5;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 0 24px 64px; }

  header { text-align: center; padding: 48px 0 0; }
  header .logo { width: 150px; height: auto; display: inline-block; }
  header .logo svg { width: 100%; height: auto; fill: var(--schwarz); }
  header h1 {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grau);
    margin-top: 28px;
  }

  .klassenkopf {
    text-align: center;
    border-bottom: 1px solid var(--linie);
    padding: 28px 0;
  }
  .klassenkopf .klasse { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.01em; }
  .klassenkopf .firma { color: var(--grau); margin-top: 2px; font-size: 1rem; }
  .klassenkopf .datum { margin-top: 12px; font-weight: 500; font-size: 1rem; }
  .klassenkopf .zeit { color: var(--grau); font-size: 0.95rem; }

  .qr-feld { text-align: center; padding: 44px 0 0; }
  .qr-rahmen {
    width: 280px;
    height: 280px;
    margin: 0 auto;
    border: 1px solid var(--linie);
    border-radius: 12px;
    padding: 10px;
  }
  .qr-rahmen svg { width: 100%; height: 100%; display: block; shape-rendering: crispEdges; }

  .qr-link {
    display: block;
    margin-top: 22px;
    font-size: 0.9rem;
    color: var(--grau);
    word-break: break-all;
    text-decoration: none;
  }

  .anleitung {
    max-width: 420px;
    margin: 36px auto 0;
    text-align: center;
    font-size: 1rem;
  }
  .anleitung .frist { color: var(--grau); font-size: 0.92rem; margin-top: 10px; }

  .drucken {
    display: block;
    margin: 44px auto 0;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 14px 32px;
    border: none;
    border-radius: 10px;
    background: var(--schwarz);
    color: #fff;
    cursor: pointer;
  }
  .drucken:active { opacity: 0.8; }

  .status-karte { text-align: center; padding: 56px 0 0; }
  .status-karte .symbol { margin-bottom: 20px; }
  .status-karte .symbol svg {
    width: 44px; height: 44px;
    stroke: var(--schwarz);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .status-karte h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  .status-karte p { color: var(--grau); font-size: 0.95rem; }
  .status-karte button {
    margin-top: 28px;
    font-size: 0.92rem;
    font-weight: 600;
    padding: 12px 28px;
    border: 1px solid var(--schwarz);
    border-radius: 10px;
    background: #fff;
    color: var(--schwarz);
    cursor: pointer;
  }
  .status-karte button + button { margin-left: 10px; }

  .lade { text-align: center; padding: 72px 0; color: var(--grau); font-size: 0.9rem; }
  .spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--linie);
    border-top-color: var(--schwarz);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: dreh 0.8s linear infinite;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }

  /* ===== Druck ===== */
  @page { size: A4 portrait; margin: 16mm; }
  @media print {
    body { line-height: 1.45; }
    .wrap { max-width: none; padding: 0; }
    .nicht-drucken { display: none !important; }
    header { padding: 0; }
    header .logo { width: 36mm; }
    header h1 { margin-top: 7mm; font-size: 10pt; }
    .klassenkopf { padding: 8mm 0; }
    .klassenkopf .klasse { font-size: 20pt; }
    .klassenkopf .firma { font-size: 12pt; }
    .klassenkopf .datum { font-size: 12pt; margin-top: 4mm; }
    .klassenkopf .zeit { font-size: 11pt; }
    .qr-feld { padding: 12mm 0 0; }
    /* 78mm inklusive Ruhezone: der eigentliche Code misst je nach Version 56mm bis 65mm */
    .qr-rahmen { width: 78mm; height: 78mm; border: none; padding: 0; }
    .qr-link { font-size: 10pt; margin-top: 6mm; color: var(--schwarz); }
    .anleitung { margin-top: 10mm; font-size: 11.5pt; }
    .anleitung .frist { font-size: 10.5pt; }
  }
</style>
</head>

"use strict";

const MOCK_DATEN = {
  ok: true,
  klasse: "SORBA EDV AG Lernende 2. Jahr",
  firma: "SORBA EDV AG",
  datum: "2026-08-28",
  datumText: "Freitag, 28.08.2026",
  essenszeit: "12:00"
};

const params = new URLSearchParams(location.search);
const code = (params.get("klasse") || "").trim();
const mock = params.get("mock") === "1";

const el = id => document.getElementById(id);

function zeige(ansicht) {
  ["laden", "fehler", "blatt"].forEach(a => {
    el("ansicht-" + a).style.display = (a === ansicht) ? "" : "none";
  });
}

function zeigeFehler(titel, text, retry, anmelden) {
  el("fehler-titel").textContent = titel;
  el("fehler-text").textContent = text;
  el("btn-retry").style.display = retry ? "" : "none";
  el("btn-anmelden").style.display = anmelden ? "" : "none";
  zeige("fehler");
}

/* Aus einem Klassensatz die Anzeigewerte des Blattes machen. Beide Wege,
   der anonyme über Flow B und der angemeldete über Graph, liefern dieselbe
   Form. */
function blattdaten(klasse) {
  return {
    ok:         true,
    klasse:     klasse.titel,
    firma:      klasse.firma,
    datum:      klasse.datum,
    datumText:  Hilfe.datumText(klasse.datum),
    essenszeit: klasse.essenszeit
  };
}

/* Das Kursblatt ist bewusst ohne Anmeldung erreichbar, damit die Réception
   seinen Link auch der Kursleitung schicken kann. Es lädt deshalb anonym
   über Flow B, dieselbe Quelle wie die Gästeseite. Preisgegeben wird nur,
   was auf dem Aushang ohnehin steht, und nur an jemanden, der den
   achtstelligen Code bereits kennt.

   Der Weg über Microsoft Graph bleibt als Rückfall bestehen, falls Flow B
   einmal nicht antwortet. Er wird aber nie von selbst eingeschlagen: eine
   unerwartete Weiterleitung zur Microsoft-Anmeldung wäre für eine
   Kursleitung ohne Konto nicht zu verstehen. Stattdessen erscheint ein
   Knopf, den nur die Réception benutzt. */
async function ladeKlasse(mitKonto) {
  zeige("laden");
  if (!mock && !code) {
    zeigeFehler("Ungültiger Link", "Dieser Link ist unvollständig. Bitte rufen Sie die Seite mit dem Klassencode auf, zum Beispiel kursblatt.html?klasse=ABC123.", false, false);
    return;
  }
  try {
    let daten;
    if (mock) {
      await new Promise(r => setTimeout(r, 300));
      daten = MOCK_DATEN;
    } else if (mitKonto) {
      await Auth.anmeldungSicherstellen();
      const klasse = await Graph.klasseNachCode(code);
      if (!klasse) {
        zeigeFehler("Ungültiger Link", "Diese Klasse wurde nicht gefunden. Bitte prüfen Sie den Klassencode.", false, false);
        return;
      }
      daten = blattdaten(klasse);
    } else {
      const klasse = await Graph.klasseOeffentlich(code);
      if (!klasse) {
        zeigeFehler("Kursblatt nicht abrufbar",
          "Zu diesem Klassencode wurde nichts gefunden. Bitte prüfen Sie den Link. "
          + "Mitarbeitende der Réception können es mit ihrem Geschäftskonto nochmals versuchen.",
          true, true);
        return;
      }
      daten = blattdaten(klasse);
    }
    if (!daten.ok) {
      zeigeFehler("Ungültiger Link", "Diese Klasse wurde nicht gefunden. Bitte prüfen Sie den Klassencode.", false, false);
      return;
    }

    el("kopf-klasse").textContent = daten.klasse || "";
    el("kopf-firma").textContent = daten.firma || "";
    el("kopf-datum").textContent = daten.datumText || daten.datum || "";
    el("kopf-zeit").textContent = daten.essenszeit ? "Mittagessen um " + daten.essenszeit + " Uhr" : "";

    const ziel = Hilfe.gastLink(code || "MOCK");
    if (typeof qrcode === "undefined") {
      el("qr-rahmen").textContent = "Der QR-Code konnte nicht erzeugt werden. Bitte laden Sie die Seite mit bestehender Internetverbindung neu.";
    } else {
      const qr = qrcode(0, "M");      // 0 = kleinste passende Version automatisch
      qr.addData(ziel);
      qr.make();
      // Die Ruhezone von vier Modulen, welche die Norm verlangt, wird
      // mitgezeichnet. Ohne sie verweigern Scanner den Code oft, weil unter
      // dem Symbol gleich der Linktext folgt. Achtung: margin zählt in
      // SVG-Einheiten, nicht in Modulen; bei cellSize 2 sind vier Module
      // also 8. Das Symbol selbst misst dadurch im Druck rund 63 mm statt
      // der vollen 78 mm des Rahmens.
      el("qr-rahmen").innerHTML = qr.createSvgTag({ scalable: true, cellSize: 2, margin: 8 });
    }
    const link = el("qr-link");
    link.textContent = ziel;
    link.href = ziel;

    el("frist-text").textContent =
      "Bitte wählen Sie bis " + Hilfe.annahmeschlussText() + " Uhr. "
      + "Danach sind Änderungen nur noch über die Réception möglich.";

    document.title = "Menüwahl " + (daten.klasse || "");
    zeige("blatt");
  } catch (e) {
    zeigeFehler("Verbindungsfehler",
      (e && e.message) ? e.message
        : "Die Klassendaten konnten nicht geladen werden. Bitte prüfen Sie die Internetverbindung.",
      true, !mitKonto);
  }
}

el("btn-retry").addEventListener("click", () => ladeKlasse(false));
el("btn-anmelden").addEventListener("click", () => ladeKlasse(true));
el("btn-drucken").addEventListener("click", () => window.print());

ladeKlasse(false);
</script>
</body>
</html>
