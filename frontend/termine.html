<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Alle Termine Menüwahl BAULÜÜT</title>
<link rel="icon" type="image/webp" href="https://baulueuet.ch/wp-content/uploads/2019/06/cropped-bauluut_favicon_neg3-32x32.webp">
<style>
  :root {
    --orange: #E8722A;
    --schwarz: #111111;
    --grau: #767676;
    --linie: #ebebeb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #fff;
    color: var(--schwarz);
    line-height: 1.5;
    /* Ein langer Kurstitel darf die Seite nie seitlich hinausschieben. */
    overflow-wrap: break-word;
  }
  /* Der seitliche Rand wächst mit der Fensterbreite mit. */
  .wrap { max-width: 900px; margin: 0 auto; padding: 0 clamp(16px, 3vw, 24px) 64px; }

  header {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 28px 0 20px;
    border-bottom: 1px solid var(--linie);
  }
  header .logo { width: clamp(64px, 15vw, 84px); flex: none; line-height: 0; }
  header .logo svg { width: 100%; height: auto; fill: var(--schwarz); }
  header h1 {
    font-size: 0.8rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--grau);
  }
  .kopf-rechts {
    margin-left: auto;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: 8px 16px;
    min-width: 0;
    font-size: 0.85rem;
    color: var(--grau);
    text-align: right;
  }
  /* Die Obergrenze für den Namen wächst mit der Fensterbreite mit, statt an
     einer festen Schwelle zu springen. */
  .kopf-name {
    max-width: min(220px, 45vw);
    min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  button.knopf {
    font-size: 0.88rem;
    font-weight: 600;
    padding: 10px 18px;
    border: 1px solid var(--schwarz);
    border-radius: 10px;
    background: #fff;
    color: var(--schwarz);
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button.knopf:active { opacity: 0.7; }
  button.knopf:disabled { opacity: 0.4; cursor: default; }

  .werkzeuge { display: flex; flex-wrap: wrap; gap: 10px; margin: 24px 0 8px; }
  @media (max-width: 560px) {
    button.knopf { min-height: 44px; }
    .werkzeuge button { flex: 1 1 150px; }
  }

  /* Zusammenzug über den ganzen gezeigten Zeitraum */
  .uebersicht {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 1px;
    background: var(--linie);
    border: 1px solid var(--linie);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 20px;
  }
  @media (min-width: 640px) { .uebersicht { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .uebersicht div {
    padding: 12px 8px;
    text-align: center;
    background: #fff;
  }
  .uebersicht b { display: block; font-size: 1.3rem; font-weight: 700; }
  .uebersicht span {
    font-size: 0.66rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--grau);
  }

  /* Ein Block je Datum */
  .tag { margin-top: 34px; }
  .tag-kopf {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px;
    border-bottom: 1px solid var(--schwarz);
    padding-bottom: 8px;
  }
  .tag-kopf .tag-datum { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.01em; }
  .tag-kopf .tag-heute {
    font-size: 0.66rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--orange);
  }
  .tag-kopf .tag-summe { margin-left: auto; font-size: 0.82rem; color: var(--grau); }

  .tabellenrahmen { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th {
    text-align: left;
    font-size: 0.66rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.14em; color: var(--grau);
    padding: 10px 12px 8px 0;
    border-bottom: 1px solid var(--linie);
    white-space: nowrap;
  }
  td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--linie); vertical-align: top; }
  td:last-child, th:last-child { padding-right: 0; }
  th.zahl, td.zahl { text-align: right; white-space: nowrap; }
  td.zeit { white-space: nowrap; color: var(--grau); }
  td.kurs { font-weight: 600; }
  td.firma { color: var(--grau); }
  td.leerzahl { color: var(--orange); font-weight: 700; }

  .marke-zu {
    display: inline-block;
    margin-left: 8px;
    font-size: 0.62rem; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.12em; color: var(--grau);
    border: 1px solid var(--linie);
    border-radius: 8px;
    padding: 1px 6px;
    vertical-align: 1px;
  }

  /* Sechs Spalten sind auf dem Telefon nicht mehr lesbar. Dort wird aus
     jeder Kurszeile eine Karte: der Kursname als Überschrift, darunter Zeit
     und Firma, zuunterst die drei Zahlen nebeneinander mit ihrer
     Spaltenbezeichnung aus data-spalte. Die Reihenfolge stellt order um, die
     Zeile ist dafür eine Flex-Zeile. Im Markup bleibt alles eine Tabelle.
     Die Regel gilt bewusst nur für den Bildschirm: gedruckt wird immer die
     Tabelle, unabhängig von der Papierbreite. */
  @media screen and (max-width: 640px) {
    .tabellenrahmen table,
    .tabellenrahmen tbody { display: block; }
    .tabellenrahmen thead { display: none; }
    .tabellenrahmen tr {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      border: 1px solid var(--linie);
      border-radius: 10px;
      padding: 14px 16px;
      margin-top: -1px;
    }
    .tabellenrahmen tr:first-child { border-radius: 10px 10px 0 0; margin-top: 0; }
    .tabellenrahmen tr:last-child { border-radius: 0 0 10px 10px; }
    .tabellenrahmen tr:only-child { border-radius: 10px; }
    .tabellenrahmen td { display: block; flex: 1 1 100%; border: none; padding: 0; }
    .tabellenrahmen td:empty { display: none; }
    .tabellenrahmen td::before {
      content: attr(data-spalte);
      display: block;
      font-size: 0.66rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.14em; color: var(--grau);
    }
    .tabellenrahmen td.kurs { order: 1; font-size: 1rem; }
    .tabellenrahmen td.zeit { order: 2; font-size: 0.88rem; }
    .tabellenrahmen td.firma { order: 3; font-size: 0.88rem; }
    .tabellenrahmen td.zahl { order: 4; flex: 1 1 0; text-align: left; margin-top: 6px; }
    /* Kursname, Zeit und Firma sprechen für sich und brauchen keine
       Beschriftung; nur die drei Zahlen bekommen eine. */
    .tabellenrahmen td.kurs::before,
    .tabellenrahmen td.zeit::before,
    .tabellenrahmen td.firma::before { display: none; }
  }

  .leer { padding: 40px 0; color: var(--grau); font-size: 0.92rem; text-align: center; }

  .fusszeile {
    margin-top: 36px;
    padding-top: 16px;
    border-top: 1px solid var(--linie);
    font-size: 0.8rem;
    color: var(--grau);
  }

  .fehlerfeld {
    display: none;
    border-left: 3px solid #c0392b;
    color: #c0392b;
    padding: 6px 12px;
    margin-top: 20px;
    font-size: 0.9rem;
  }

  .lade { text-align: center; padding: clamp(56px, 14vw, 96px) 0; color: var(--grau); font-size: 0.9rem; }
  .spinner {
    width: 26px; height: 26px;
    border: 2px solid var(--linie);
    border-top-color: var(--schwarz);
    border-radius: 50%;
    margin: 0 auto 16px;
    animation: dreh 0.8s linear infinite;
  }
  @keyframes dreh { to { transform: rotate(360deg); } }

  .status-karte { text-align: center; padding: clamp(48px, 12vw, 72px) 0 0; max-width: 480px; margin: 0 auto; }
  .status-karte .symbol { margin-bottom: 20px; }
  .status-karte .symbol svg {
    width: 44px; height: 44px;
    stroke: var(--schwarz);
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .status-karte h2 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
  .status-karte p { color: var(--grau); font-size: 0.95rem; }
  .status-karte button { margin-top: 28px; }

  /* ===== Druck ===== */
  @page { size: A4 portrait; margin: 14mm; }
  @media print {
    body { line-height: 1.35; }
    .wrap { max-width: none; padding: 0; }
    .nicht-drucken { display: none !important; }
    header { padding: 0 0 4mm; }
    header .logo { width: 24mm; }
    header h1 { font-size: 9pt; }
    .uebersicht { margin-top: 5mm; break-inside: avoid; page-break-inside: avoid; }
    .uebersicht div { padding: 2.5mm 3mm; }
    .uebersicht b { font-size: 12pt; }
    .uebersicht span { font-size: 7.5pt; }
    .tag { margin-top: 7mm; break-inside: avoid; page-break-inside: avoid; }
    .tag-kopf .tag-datum { font-size: 11.5pt; }
    table { font-size: 9.5pt; }
    thead { display: table-header-group; }
    tr { break-inside: avoid; page-break-inside: avoid; }
    td { padding: 2.2mm 3mm 2.2mm 0; }
    .fusszeile { margin-top: 5mm; font-size: 9pt; color: var(--schwarz); }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@4.30.0/lib/msal-browser.min.js"
        integrity="sha384-RGxxfG5yRS8DLU7ZJ8OoLhbV/BsJFHyPuMVHrTLbpj3t5Z15LnviJmaznKY/a7LZ"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="konfig.js"></script>
<script src="auth.js"></script>
<script src="graph.js"></script>
<script>
"use strict";

/* ====================================================================
   termine.html: alle Kurstermine nach Datum gruppiert.

   Gedacht als Vorschau für das Restaurant: Wie viele Kurse essen an
   welchem Tag, um welche Zeit, und wie viele Bestellungen liegen dafür
   schon vor. Die Seite ändert nichts, sie liest nur.

   Aufbau wie admin.html: Auth und Graph werden in lokale Namen gelegt,
   im Mock-Modus (?mock=1) zeigen diese Namen auf Attrappen.
   ==================================================================== */

const el = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const istMock = params.get("mock") === "1";


/* ---------- Attrappen für den Mock-Modus ---------- */

function mockBauen() {
  function tagVerschoben(n) {
    const d = new Date();
    d.setDate(d.getDate() + n);
    return d.getFullYear() + "-"
      + String(d.getMonth() + 1).padStart(2, "0") + "-"
      + String(d.getDate()).padStart(2, "0");
  }

  const klassen = [
    { id: "1", titel: "Polierkurs Modul 4",           firma: "Implenia Schweiz AG", datum: tagVerschoben(0),  essenszeit: "12:15", code: "M2VJ8KWS", status: "offen" },
    { id: "2", titel: "Kranführerkurs Grundlagen",     firma: "Marti AG",            datum: tagVerschoben(0),  essenszeit: "11:45", code: "R6ZDF4YT", status: "offen" },
    { id: "3", titel: "Baukader Führungsseminar",      firma: "Campus Sursee",       datum: tagVerschoben(1),  essenszeit: "11:45", code: "TQ4X9BND", status: "offen" },
    { id: "4", titel: "SORBA EDV AG Lernende 2. Jahr", firma: "SORBA EDV AG",        datum: tagVerschoben(6),  essenszeit: "12:00", code: "K7HMP3RA", status: "offen" },
    { id: "5", titel: "Vermessungskurs Aufbau",        firma: "Implenia Schweiz AG", datum: tagVerschoben(6),  essenszeit: "12:30", code: "P8WQ2LMD", status: "offen" },
    { id: "6", titel: "Sicherheitsschulung Tiefbau",   firma: "Marti AG",            datum: tagVerschoben(13), essenszeit: "12:00", code: "H4NRT7XB", status: "offen" },
    { id: "7", titel: "Schalungskurs Abschluss",       firma: "Campus Sursee",       datum: tagVerschoben(-4), essenszeit: "12:00", code: "Z3KMV9QP", status: "geschlossen" }
  ];

  /* Ein paar Bestellungen, damit die Zahlen nicht alle null sind. Klasse 4
     und 6 bleiben bewusst leer: so ist zu sehen, wie ein Kurs ohne einzige
     Bestellung aussieht. */
  const bestellungen = [];
  const verteilung = { "1": 14, "2": 9, "3": 22, "4": 0, "5": 6, "6": 0, "7": 18 };
  Object.keys(verteilung).forEach(klasseId => {
    for (let i = 0; i < verteilung[klasseId]; i++) {
      bestellungen.push({
        id: klasseId + "-" + i,
        klasseId: klasseId,
        vorname: "Vorname" + i,
        nachname: "Nachname" + i,
        vorspeise: i % 3 === 0 ? "Suppe" : (i % 3 === 1 ? "Salat" : "Keine"),
        hauptgang: i % 2 === 0 ? "Menü 1" : "Menü 2",
        bemerkung: ""
      });
    }
  });

  function warten() { return new Promise(r => setTimeout(r, 220)); }
  function kopie(o) { return JSON.parse(JSON.stringify(o)); }

  return {
    auth: {
      anmeldungSicherstellen: async function () {
        await warten();
        return { name: "Testperson (Mock-Modus)", adresse: "mock@campus-sursee.ch" };
      },
      konto: function () {
        return { name: "Testperson (Mock-Modus)", adresse: "mock@campus-sursee.ch" };
      }
    },
    graph: {
      klassen: async function () {
        await warten();
        return kopie(klassen).sort((a, b) => (b.datum || "").localeCompare(a.datum || ""));
      },
      bestellungen: async function () {
        await warten();
        return kopie(bestellungen);
      }
    }
  };
}

/* Ab hier arbeitet die ganze Seite nur noch mit diesen beiden Namen. */
let Anmeldung = Auth;
let Daten = Graph;
if (istMock) {
  const attrappe = mockBauen();
  Anmeldung = attrappe.auth;
  Daten = attrappe.graph;
}


/* ---------- Zustand ---------- */

let alleKlassen = [];
let zahlenProKlasse = {};   // klasseId -> {total, menu1, menu2}
let zeigeVergangene = false;


/* ---------- kleine Helfer ---------- */

function leeren(knoten) {
  while (knoten.firstChild) knoten.removeChild(knoten.firstChild);
}

function neu(tag, klasse, text) {
  const k = document.createElement(tag);
  if (klasse) k.className = klasse;
  if (text !== undefined && text !== null) k.textContent = text;
  return k;
}

function ansichtZeigen(welche) {
  ["laden", "fehler", "liste"].forEach(a => {
    el("ansicht-" + a).style.display = (a === welche) ? "" : "none";
  });
}

function fehlerZeigen(e) {
  const feld = el("fehler-global");
  feld.textContent = (e && e.message) ? e.message : String(e);
  feld.style.display = "block";
  window.scrollTo(0, 0);
}


/* ---------- Daten holen ---------- */

/* Wie in der Verwaltung werden beide Listen ganz geholt und im Browser
   zusammengeführt; serverseitige Filter setzen in SharePoint einen
   Spaltenindex voraus. */
async function termineLaden() {
  el("fehler-global").style.display = "none";
  try {
    const [klassen, bestellungen] = await Promise.all([
      Daten.klassen(),
      Daten.bestellungen()
    ]);
    alleKlassen = klassen;

    zahlenProKlasse = {};
    bestellungen.forEach(b => {
      const schluessel = String(b.klasseId);
      const z = zahlenProKlasse[schluessel]
        || (zahlenProKlasse[schluessel] = { total: 0, menu1: 0, menu2: 0 });
      z.total++;
      if (String(b.hauptgang || "").indexOf("1") >= 0) z.menu1++;
      else if (String(b.hauptgang || "").indexOf("2") >= 0) z.menu2++;
    });

    zeichnen();
  } catch (e) {
    fehlerZeigen(e);
  }
}


/* ---------- Anzeige ---------- */

function sichtbareKlassen() {
  const heute = Hilfe.heute();
  return alleKlassen.filter(k => ((k.datum || "") < heute) === zeigeVergangene);
}

/* Klassen nach Datum zusammenfassen. Kommende Termine stehen aufsteigend,
   der nächste zuoberst; vergangene absteigend, der letzte zuoberst. */
function nachDatum(klassen) {
  const tage = {};
  klassen.forEach(k => {
    const datum = k.datum || "";
    (tage[datum] || (tage[datum] = [])).push(k);
  });
  const reihenfolge = Object.keys(tage).sort();
  if (zeigeVergangene) reihenfolge.reverse();
  return reihenfolge.map(datum => ({
    datum: datum,
    klassen: tage[datum].sort((a, b) =>
      (a.essenszeit || "").localeCompare(b.essenszeit || "")
      || (a.titel || "").localeCompare(b.titel || "", "de-CH"))
  }));
}

function zahlen(klasseId) {
  return zahlenProKlasse[String(klasseId)] || { total: 0, menu1: 0, menu2: 0 };
}

function zeichnen() {
  const treffer = sichtbareKlassen();
  const gruppen = nachDatum(treffer);

  uebersichtZeichnen(treffer, gruppen.length);

  const behaelter = el("tage");
  leeren(behaelter);

  const leerfeld = el("leer");
  if (!gruppen.length) {
    leerfeld.style.display = "block";
    leerfeld.textContent = zeigeVergangene
      ? "Keine vergangenen Termine vorhanden."
      : "Keine anstehenden Termine vorhanden.";
  } else {
    leerfeld.style.display = "none";
    gruppen.forEach(g => behaelter.appendChild(tagZeichnen(g)));
  }

  el("fusszeile").textContent =
    "Stand: " + Hilfe.zeitstempelKurz(new Date().toISOString())
    + " · Die Teilnehmenden wählen am Kurstag bis " + Hilfe.annahmeschlussText()
    + " Uhr, danach ändert nur noch die Réception."
    + " Klassen und Bestellungen werden nach 30 Tagen automatisch gelöscht.";
}

function uebersichtZeichnen(klassen, anzahlTage) {
  let bestellungen = 0, menu1 = 0, menu2 = 0;
  klassen.forEach(k => {
    const z = zahlen(k.id);
    bestellungen += z.total;
    menu1 += z.menu1;
    menu2 += z.menu2;
  });

  const behaelter = el("uebersicht");
  leeren(behaelter);
  [["Tage", anzahlTage], ["Kurse", klassen.length],
   ["Bestellungen", bestellungen], ["Menü 1 / Menü 2", menu1 + " / " + menu2]
  ].forEach(([name, wert]) => {
    const kasten = neu("div");
    kasten.appendChild(neu("b", null, String(wert)));
    kasten.appendChild(neu("span", null, name));
    behaelter.appendChild(kasten);
  });
}

function tagZeichnen(gruppe) {
  const block = neu("div", "tag");

  const kopf = neu("div", "tag-kopf");
  kopf.appendChild(neu("div", "tag-datum", Hilfe.datumText(gruppe.datum) || "ohne Datum"));
  if (gruppe.datum === Hilfe.heute()) kopf.appendChild(neu("div", "tag-heute", "heute"));

  let summe = 0;
  gruppe.klassen.forEach(k => { summe += zahlen(k.id).total; });
  kopf.appendChild(neu("div", "tag-summe",
    gruppe.klassen.length + (gruppe.klassen.length === 1 ? " Kurs" : " Kurse")
    + " · " + summe + (summe === 1 ? " Bestellung" : " Bestellungen")));
  block.appendChild(kopf);

  const rahmen = neu("div", "tabellenrahmen");
  const tabelle = neu("table");

  const kopfzeile = neu("tr");
  [["Zeit", null], ["Kurs", null], ["Firma", null],
   ["Best.", "zahl"], ["Menü 1", "zahl"], ["Menü 2", "zahl"]].forEach(([t, klasse]) => {
    kopfzeile.appendChild(neu("th", klasse, t));
  });
  const kopfteil = neu("thead");
  kopfteil.appendChild(kopfzeile);
  tabelle.appendChild(kopfteil);

  const koerper = neu("tbody");
  gruppe.klassen.forEach(k => {
    const z = zahlen(k.id);
    const zeile = neu("tr");

    /* data-spalte trägt die Spaltenbezeichnung an der Zelle mit. Auf
       schmalen Bildschirmen wird daraus die Beschriftung der Karte, siehe
       den Abschnitt zur Tabelle im CSS. */
    function zelle(knoten, bezeichnung) {
      knoten.setAttribute("data-spalte", bezeichnung);
      zeile.appendChild(knoten);
      return knoten;
    }

    zelle(neu("td", "zeit", k.essenszeit ? k.essenszeit + " Uhr" : "—"), "Zeit");

    const kurs = zelle(neu("td", "kurs", k.titel || "Ohne Titel"), "Kurs");
    if (k.status !== "offen") kurs.appendChild(neu("span", "marke-zu", "geschlossen"));

    zelle(neu("td", "firma", k.firma || ""), "Firma");
    /* Ein Kurs ohne einzige Bestellung fällt farbig auf: dort fehlt für die
       Küche noch alles, und die Réception muss meist nachfassen. */
    zelle(neu("td", z.total ? "zahl" : "zahl leerzahl", String(z.total)), "Best.");
    zelle(neu("td", "zahl", String(z.menu1)), "Menü 1");
    zelle(neu("td", "zahl", String(z.menu2)), "Menü 2");

    koerper.appendChild(zeile);
  });
  tabelle.appendChild(koerper);
  rahmen.appendChild(tabelle);
  block.appendChild(rahmen);

  return block;
}


/* ---------- Ereignisse ---------- */

function umschalterBeschriften() {
  el("btn-umschalten").textContent = zeigeVergangene ? "Kommende anzeigen" : "Vergangene anzeigen";
  document.title = (zeigeVergangene ? "Vergangene Termine" : "Alle Termine") + " Menüwahl BAULÜÜT";
}

el("btn-umschalten").addEventListener("click", () => {
  zeigeVergangene = !zeigeVergangene;
  umschalterBeschriften();
  zeichnen();
});
el("btn-aktualisieren").addEventListener("click", termineLaden);
el("btn-drucken").addEventListener("click", () => window.print());
el("btn-erneut").addEventListener("click", () => location.reload());


/* ---------- Start ---------- */

async function starten() {
  ansichtZeigen("laden");
  let konto;
  try {
    konto = await Anmeldung.anmeldungSicherstellen();
  } catch (e) {
    el("fehler-text").textContent = (e && e.message) ? e.message : String(e);
    ansichtZeigen("fehler");
    return;
  }

  if (!konto) konto = Anmeldung.konto();
  el("kopf-name").textContent = konto ? (konto.name || konto.adresse || "") : "";

  umschalterBeschriften();
  ansichtZeigen("liste");
  await termineLaden();
}

starten();
</script>
